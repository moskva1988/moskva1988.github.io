<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support the author</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f4f7fb; --card:#ffffff; --text:#1f2937; --soft:#6b7280; --line:#d5dbe5; --blue:#3b82f6; --blue-dark:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --text:#e5e7eb; --soft:#9ca3af; --line:#334155; --blue:#3b82f6; --blue-dark:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size:26px; margin:0 0 6px; text-align:center; }
  .lead { color:var(--soft); margin:0 0 22px; text-align:center; }
  .way { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:0 0 12px; }
  .way h2 { font-size:17px; margin:0 0 2px; }
  .way p { color:var(--soft); font-size:14px; margin:0 0 12px; }
  .open { display:block; text-align:center; background:var(--blue); color:#fff; text-decoration:none;
          font-weight:600; padding:12px; border-radius:10px; }
  .open:hover { filter:brightness(1.08); }
  .address { display:block; overflow-wrap:anywhere; font-size:13px; padding:10px 12px; margin:0 0 10px;
             border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  button.open { width:100%; border:0; font:inherit; font-weight:600; cursor:pointer; }
  .other { display:block; text-align:center; font-size:14px; margin-top:12px; }
  .empty { text-align:center; color:var(--soft); padding:24px 8px; }
  footer { color:var(--soft); font-size:13px; margin-top:24px; text-align:center; }
  a { color:var(--blue-dark); }
</style>
</head>
<body>
<main>
  <h1 id="title">Support the author</h1>
  <p class="lead" id="lead">These programs are free. If one of them helps you, you can support the author.</p>
  <div id="ways"></div>
  <footer><a href="../" id="back">All programs</a></footer>
</main>
<script>
// ---- The ways to support. To change them: edit this list, then run tools/publish_support.sh ----
// A way is shown when it has a link (url) or an address; an empty one is left out.
//   url     — what the button opens: a payment page, a Telegram bot, a transfer link
//   urls    — the same, but its own link for each list of programs (see GROUPS)
//   alts    — a second, smaller link under the button (with altText), also one for each list
//   address — a wallet address in the TON network: the button copies it (that works with every wallet);
//             a small link below tries to open a wallet app, which not every phone has
const WAYS = [
  { title: "Bank card or SBP", note: "A card of any country, or SBP. The payment page opens in the browser.",
    urls: { apps: "", seafarers: "https://web.tribute.tg/d/UN7" },
    alts: { apps: "", seafarers: "https://t.me/tribute/app?startapp=dUN7" }, altText: "or pay inside Telegram" },
  // Stars go to the pinned post of the channel of the person's list: fill in both links (t.me/<channel>/<post>)
  { title: "Telegram Stars", note: "Opens the channel in Telegram: tap the star under the pinned post.",
    urls: { apps: "https://t.me/handyfreeapps/4", seafarers: "https://t.me/FreeAppsSeafarers/4" } },
  { title: "Wallet",    note: "Send Gram or USDT in the TON network to this address, from any wallet.", address: "UQAuhP3cdheYicjW3ZX2KDj_34evsdtspHmOKvJangmu-b6Q" },
  { title: "MarTrust",  note: "For seafarers with a MarTrust Account: a free Crew-to-Crew transfer.", url: "https://martrust.me/4cbbt6vfyc" },
];
// ---- The programs that send people here: page.../support/?app=<key> ----
// Each program belongs to one of the two lists; a list page sends people here as ?group=<list>.
const APPS = { tuchka: { name: "Tuchka", group: "apps" } };
const GROUPS = ["apps", "seafarers"];

const key = new URLSearchParams(location.search).get("app") || "";
const known = Object.prototype.hasOwnProperty.call(APPS, key) ? APPS[key] : null;   // only a name from the list is shown
const app = known ? known.name : "";
const asked = new URLSearchParams(location.search).get("group") || "";
const group = known ? known.group : (GROUPS.includes(asked) ? asked : "");
const link = w => (w.urls ? (w.urls[group] || w.urls.apps || "") : (w.url || "")).trim();
const second = w => (w.alts ? (w.alts[group] || w.alts.apps || "") : "").trim();
if (app) {
  document.getElementById("title").textContent = "Support " + app;
  document.getElementById("lead").textContent = app + " is free. If it helps you, you can support the author.";
  document.title = "Support " + app;
}
if (group) document.getElementById("back").href = "../" + group + "/";
const box = document.getElementById("ways");
const shown = WAYS.filter(w => link(w) || (w.address || "").trim());
if (!shown.length) {
  const p = document.createElement("p");
  p.className = "empty";
  p.textContent = "The ways to support are being set up. Thank you for wanting to help — please look in again soon.";
  box.appendChild(p);
}
for (const w of shown) {
  const address = (w.address || "").trim();
  const card = document.createElement("section");
  card.className = "way";
  const h = document.createElement("h2"); h.textContent = w.title; card.appendChild(h);
  const n = document.createElement("p"); n.textContent = w.note || ""; card.appendChild(n);
  if (address) {
    const code = document.createElement("code"); code.className = "address"; code.textContent = address;
    card.appendChild(code);
    const b = document.createElement("button"); b.type = "button"; b.className = "open";
    b.textContent = "Copy the address";
    b.onclick = () => navigator.clipboard.writeText(address).then(() => { b.textContent = "Copied"; });
    card.appendChild(b);
    const a = document.createElement("a"); a.className = "other";
    a.href = "ton://transfer/" + encodeURIComponent(address);
    a.textContent = "or open it in a wallet app";
    card.appendChild(a);
  } else {
    const a = document.createElement("a"); a.className = "open";
    a.href = link(w); a.rel = "noopener"; a.textContent = "Open";
    card.appendChild(a);
    if (second(w)) {
      const o = document.createElement("a"); o.className = "other";
      o.href = second(w); o.rel = "noopener"; o.textContent = w.altText || "another way";
      card.appendChild(o);
    }
  }
  box.appendChild(card);
}
</script>
</body>
</html>
