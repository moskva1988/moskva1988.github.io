<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free programs for seafarers</title>
<style>
  :root { --bg:#f4f7fb; --card:#ffffff; --text:#1f2937; --soft:#6b7280; --line:#d5dbe5; --blue-dark:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --text:#e5e7eb; --soft:#9ca3af; --line:#334155; --blue-dark:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size:26px; margin:0 0 6px; }
  .lead { color:var(--soft); margin:0 0 18px; }
  .app { display:flex; gap:14px; align-items:center; background:var(--card); border:1px solid var(--line);
         border-radius:14px; padding:14px 16px; margin:0 0 12px; color:inherit; text-decoration:none; }
  .app img { width:48px; height:48px; flex:none; }
  .app b { display:block; font-size:17px; }
  .app span { color:var(--soft); font-size:14px; }
  .empty { color:var(--soft); background:var(--card); border:1px dashed var(--line); border-radius:14px; padding:18px 16px; }
  footer { margin-top:24px; font-size:14px; display:flex; flex-wrap:wrap; gap:8px 18px; }
  a { color:var(--blue-dark); }
</style>
</head>
<body>
<main>
  <h1>For seafarers</h1>
  <p class="lead">Tools for work on board and ashore. Free, nothing to install.</p>
  <p class="empty">The first programs are on the way. Meanwhile, the everyday tools are useful on board too.</p>
  <footer><a href="../support/?group=seafarers">Support the author</a><a href="../apps/">Programs for everyone</a></footer>
</main>
</body>
</html>
